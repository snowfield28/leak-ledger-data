name: collect-inbox

# 毎日、新着の漏えい報道と公式発表の本文を集めて inbox.json に出す。
# 台帳への反映（判断）は、定期実行のClaudeが inbox.json を読んで行う。
on:
  schedule:
    - cron: "0 19 * * *"   # 毎日 04:00 JST（定期実行のClaudeより前）
  workflow_dispatch: {}
  push:
    paths:
      - "manual/**"

permissions:
  contents: write

concurrency:
  group: collect-inbox
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: データの検証
        run: python3 tools/validate.py
      - name: 収集
        run: python3 tools/collect.py
      - name: 変更をコミット
        run: |
          git config user.name "leak-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inbox.json inbox_seen.json inbox manual
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "inbox: 新着の収集 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
